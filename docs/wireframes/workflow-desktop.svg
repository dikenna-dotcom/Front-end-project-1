<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wireframe-title wireframe-description" width="1440" height="1060" viewBox="0 0 1440 1060"><title id="wireframe-title">How It Works page wireframe, desktop viewport</title><desc id="wireframe-description">Low-fidelity structural layout reconstruction made after website implementation for review. It is not an original pre-implementation planning artifact.</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="144" y="16" width="1152" height="74" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="156" y="41" font-size="14" font-weight="700" fill="#334155">UAR  Universal Application Runtime</text><rect x="154" y="64" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="159" y="78" font-size="9" font-weight="400" fill="#334155">Home</text><rect x="215" y="64" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="220" y="78" font-size="9" font-weight="400" fill="#334155">Features</text><rect x="281" y="64" width="85" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="286" y="78" font-size="9" font-weight="400" fill="#334155">How it works</text><rect x="371" y="64" width="91" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="376" y="78" font-size="9" font-weight="400" fill="#334155">Compatibility</text><rect x="467" y="64" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="472" y="78" font-size="9" font-weight="400" fill="#334155">Security</text><rect x="533" y="64" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="538" y="78" font-size="9" font-weight="400" fill="#334155">About</text><rect x="144" y="108" width="1152" height="83" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="158" y="128" font-size="10" font-weight="700" fill="#1d4ed8">HOW IT WORKS</text><text x="158" y="155" font-size="17" font-weight="700" fill="#0f172a">The proposed UAR workflow moves from requirements to a documented decision.</text><text x="158" y="179" font-size="10" font-weight="400" fill="#475569">Five-step explanatory sequence</text><text x="144" y="223" font-size="14" font-weight="700" fill="#0f172a">Five ordered steps</text><rect x="144" y="231" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="255" font-size="13" font-weight="700" fill="#334155">1. Describe the application</text><rect x="144" y="331" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="355" font-size="13" font-weight="700" fill="#334155">2. Compare with an environment</text><rect x="144" y="431" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="455" font-size="13" font-weight="700" fill="#334155">3. Review policy and risk</text><rect x="144" y="531" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="555" font-size="13" font-weight="700" fill="#334155">4. Consider a suitable strategy</text><rect x="144" y="631" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="655" font-size="13" font-weight="700" fill="#334155">5. Record the rationale</text><text x="144" y="751" font-size="14" font-weight="700" fill="#0f172a">Separate compatibility and policy</text><rect x="144" y="759" width="1152" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="783" font-size="13" font-weight="700" fill="#334155">Review note</text><text x="156" y="817" font-size="11" font-weight="400" fill="#64748b">Technical fit does not establish safety or privacy compliance</text><text x="144" y="855" font-size="14" font-weight="700" fill="#0f172a">Next reading</text><rect x="144" y="863" width="377" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="156" y="887" font-size="13" font-weight="700" fill="#334155">Compatibility</text><rect x="531" y="863" width="377" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="543" y="887" font-size="13" font-weight="700" fill="#334155">Security</text><rect x="918" y="863" width="377" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="930" y="887" font-size="13" font-weight="700" fill="#334155">FAQ</text><rect x="144" y="928" width="1152" height="96" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="156" y="950" font-size="12" font-weight="700" fill="#334155">Footer - UAR</text><text x="156" y="972" font-size="10" font-weight="400" fill="#334155">Explore: Home - Features - Workflow - Compatibility - Security</text><text x="156" y="990" font-size="10" font-weight="400" fill="#334155">More: Use Cases - About - FAQ</text><text x="144" y="1038" font-size="9" font-weight="400" fill="#64748b">Retrospective layout reconstruction - created after implementation - 2026-10-24 - desktop viewport 1440px</text></g></svg>