<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wireframe-title wireframe-description" width="320" height="1292" viewBox="0 0 320 1292"><title id="wireframe-title">How It Works page wireframe, mobile viewport</title><desc id="wireframe-description">Low-fidelity structural layout reconstruction made after website implementation for review. It is not an original pre-implementation planning artifact.</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="12" y="16" width="296" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="24" y="41" font-size="14" font-weight="700" fill="#334155">UAR  Universal Application Runtime</text><rect x="22" y="62" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="27" y="76" font-size="9" font-weight="400" fill="#334155">Home</text><rect x="83" y="62" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="88" y="76" font-size="9" font-weight="400" fill="#334155">Features</text><rect x="149" y="62" width="85" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="154" y="76" font-size="9" font-weight="400" fill="#334155">How it works</text><rect x="22" y="85" width="91" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="27" y="99" font-size="9" font-weight="400" fill="#334155">Compatibility</text><rect x="118" y="85" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="123" y="99" font-size="9" font-weight="400" fill="#334155">Security</text><rect x="184" y="85" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="189" y="99" font-size="9" font-weight="400" fill="#334155">About</text><rect x="12" y="116" width="296" height="179" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="26" y="136" font-size="10" font-weight="700" fill="#1d4ed8">HOW IT WORKS</text><text x="26" y="163" font-size="17" font-weight="700" fill="#0f172a">The proposed UAR</text><text x="26" y="185" font-size="17" font-weight="700" fill="#0f172a">workflow moves from</text><text x="26" y="207" font-size="17" font-weight="700" fill="#0f172a">requirements to a</text><text x="26" y="229" font-size="17" font-weight="700" fill="#0f172a">documented decision.</text><text x="26" y="283" font-size="10" font-weight="400" fill="#475569">Five-step explanatory sequence</text><text x="12" y="327" font-size="14" font-weight="700" fill="#0f172a">Five ordered steps</text><rect x="12" y="335" width="296" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="359" font-size="13" font-weight="700" fill="#334155">1. Describe the application</text><rect x="12" y="435" width="296" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="459" font-size="13" font-weight="700" fill="#334155">2. Compare with an environment</text><rect x="12" y="535" width="296" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="559" font-size="13" font-weight="700" fill="#334155">3. Review policy and risk</text><rect x="12" y="635" width="296" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="659" font-size="13" font-weight="700" fill="#334155">4. Consider a suitable strategy</text><rect x="12" y="735" width="296" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="759" font-size="13" font-weight="700" fill="#334155">5. Record the rationale</text><text x="12" y="855" font-size="14" font-weight="700" fill="#0f172a">Separate compatibility and policy</text><rect x="12" y="863" width="296" height="114" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="887" font-size="13" font-weight="700" fill="#334155">Review note</text><text x="24" y="921" font-size="11" font-weight="400" fill="#64748b">Technical fit does not establish safety</text><text x="24" y="938" font-size="11" font-weight="400" fill="#64748b">or privacy compliance</text><text x="12" y="981" font-size="14" font-weight="700" fill="#0f172a">Next reading</text><rect x="12" y="989" width="296" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="1013" font-size="13" font-weight="700" fill="#334155">Compatibility</text><rect x="12" y="1042" width="296" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="1066" font-size="13" font-weight="700" fill="#334155">Security</text><rect x="12" y="1095" width="296" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="24" y="1119" font-size="13" font-weight="700" fill="#334155">FAQ</text><rect x="12" y="1160" width="296" height="96" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="24" y="1182" font-size="12" font-weight="700" fill="#334155">Footer - UAR</text><text x="24" y="1204" font-size="10" font-weight="400" fill="#334155">Explore: Home - Features - Workflow - Compatibility - Security</text><text x="24" y="1222" font-size="10" font-weight="400" fill="#334155">More: Use Cases - About - FAQ</text><text x="12" y="1270" font-size="9" font-weight="400" fill="#64748b">Retrospective layout reconstruction - created after implementation - 2026-10-24 - mobile viewport 320px</text></g></svg>