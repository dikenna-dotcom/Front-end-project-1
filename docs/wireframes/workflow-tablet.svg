<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wireframe-title wireframe-description" width="768" height="1198" viewBox="0 0 768 1198"><title id="wireframe-title">How It Works page wireframe, tablet viewport</title><desc id="wireframe-description">Low-fidelity structural layout reconstruction made after website implementation for review. It is not an original pre-implementation planning artifact.</desc><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="Arial, sans-serif"><rect x="20" y="16" width="728" height="74" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="41" font-size="14" font-weight="700" fill="#334155">UAR  Universal Application Runtime</text><rect x="30" y="64" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="35" y="78" font-size="9" font-weight="400" fill="#334155">Home</text><rect x="91" y="64" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="96" y="78" font-size="9" font-weight="400" fill="#334155">Features</text><rect x="157" y="64" width="85" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="162" y="78" font-size="9" font-weight="400" fill="#334155">How it works</text><rect x="247" y="64" width="91" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252" y="78" font-size="9" font-weight="400" fill="#334155">Compatibility</text><rect x="343" y="64" width="61" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="348" y="78" font-size="9" font-weight="400" fill="#334155">Security</text><rect x="409" y="64" width="56" height="20" rx="3" fill="#eef4ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="414" y="78" font-size="9" font-weight="400" fill="#334155">About</text><rect x="20" y="108" width="728" height="115" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="34" y="128" font-size="10" font-weight="700" fill="#1d4ed8">HOW IT WORKS</text><text x="34" y="155" font-size="17" font-weight="700" fill="#0f172a">The proposed UAR workflow moves from requirements to a</text><text x="34" y="177" font-size="17" font-weight="700" fill="#0f172a">documented decision.</text><text x="34" y="211" font-size="10" font-weight="400" fill="#475569">Five-step explanatory sequence</text><text x="20" y="255" font-size="14" font-weight="700" fill="#0f172a">Five ordered steps</text><rect x="20" y="263" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="287" font-size="13" font-weight="700" fill="#334155">1. Describe the application</text><rect x="20" y="363" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="387" font-size="13" font-weight="700" fill="#334155">2. Compare with an environment</text><rect x="20" y="463" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="487" font-size="13" font-weight="700" fill="#334155">3. Review policy and risk</text><rect x="20" y="563" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="587" font-size="13" font-weight="700" fill="#334155">4. Consider a suitable strategy</text><rect x="20" y="663" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="687" font-size="13" font-weight="700" fill="#334155">5. Record the rationale</text><text x="20" y="783" font-size="14" font-weight="700" fill="#0f172a">Separate compatibility and policy</text><rect x="20" y="791" width="728" height="92" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="815" font-size="13" font-weight="700" fill="#334155">Review note</text><text x="32" y="849" font-size="11" font-weight="400" fill="#64748b">Technical fit does not establish safety or privacy compliance</text><text x="20" y="887" font-size="14" font-weight="700" fill="#0f172a">Next reading</text><rect x="20" y="895" width="728" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="919" font-size="13" font-weight="700" fill="#334155">Compatibility</text><rect x="20" y="948" width="728" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="972" font-size="13" font-weight="700" fill="#334155">Security</text><rect x="20" y="1001" width="728" height="45" rx="5" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="32" y="1025" font-size="13" font-weight="700" fill="#334155">FAQ</text><rect x="20" y="1066" width="728" height="96" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="32" y="1088" font-size="12" font-weight="700" fill="#334155">Footer - UAR</text><text x="32" y="1110" font-size="10" font-weight="400" fill="#334155">Explore: Home - Features - Workflow - Compatibility - Security</text><text x="32" y="1128" font-size="10" font-weight="400" fill="#334155">More: Use Cases - About - FAQ</text><text x="20" y="1176" font-size="9" font-weight="400" fill="#64748b">Retrospective layout reconstruction - created after implementation - 2026-10-24 - tablet viewport 768px</text></g></svg>